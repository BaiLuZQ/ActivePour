[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activepour"
version = "0.1.0"
description = "Active probing, conditional future prediction and model-based granular pouring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
model = ["torch>=2.5", "diffusers>=0.32", "transformers>=4.48", "accelerate", "safetensors", "sentencepiece", "protobuf"]
plots = ["matplotlib>=3.7"]
test = ["torch>=2.5"]

[tool.setuptools.packages.find]
include = ["activepour*", "simulation*"]
